[project]
name = "flight-crew-demand-analysis"
version = "0.1.0"
description = "Airport ground crew demand analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit==1.58.0",
  "pandas==2.3.3",
  "pyarrow==23.0.1",
  "numpy==2.4.2",
  "matplotlib==3.10.8",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pypdf>=5,<7", "pymupdf>=1.25,<2", "playwright>=1.50,<2"]

[tool.uv]
package = false
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

